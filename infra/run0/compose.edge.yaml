name: sciforge-run0-edge

services:
  edge:
    image: ${SCIFORGE_RUN0_EDGE_IMAGE:?Set a digest-pinned Caddy image}
    container_name: sciforge-run0-edge
    restart: unless-stopped
    read_only: true
    ports:
      - "0.0.0.0:443:443"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
    secrets:
      - source: edge_tls_certificate
        target: run0-tls-certificate.pem
        mode: 0444
      - source: edge_tls_private_key
        target: run0-tls-private-key.pem
        mode: 0400
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
      - /data:rw,noexec,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
    networks:
      edge-backplane:
        ipv4_address: 172.29.48.2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  edge_tls_certificate:
    file: ${SCIFORGE_RUN0_EDGE_TLS_CERTIFICATE_FILE:-/etc/sciforge-run0/secrets/edge-tls-certificate.pem}
  edge_tls_private_key:
    file: ${SCIFORGE_RUN0_EDGE_TLS_PRIVATE_KEY_FILE:-/etc/sciforge-run0/secrets/edge-tls-private-key.pem}

networks:
  edge-backplane:
    name: sciforge-run0-edge-backplane
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.48.0/29
          gateway: 172.29.48.1

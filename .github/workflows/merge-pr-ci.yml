name: Merge PR CI

on:
  pull_request:
    branches:
      - stage1/integration
      - gui
      - develop
      - master
  push:
    branches:
      - stage1/integration
      - gui
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Merge PR CI / Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up exact Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Assert exact toolchain
        run: node ./scripts/assert-toolchain.mjs

      - name: Install dependencies
        run: npm ci

      - name: Assert Electron binary availability
        run: npm run electron:binary:assert

      - name: Check workflow and release boundary
        run: npm run ci:workflow-policy-check

      - name: Check license policy
        run: npm run license:policy-check

      - name: Check generated composition drift
        run: |
          npm run domain-packages:generate
          npm run capability:generate
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          npm run domain-packages:check
          npm run capability:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
